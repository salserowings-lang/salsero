<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SALSERO — Panel de Control</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
        body { background-color: #f9f9f9; }
        header { background-color: #c01e38; color: white; padding: 24px; text-align: center; }
        .container { max-width: 1200px; margin: 0 auto; padding: 24px; }
        h2 { font-size: 20px; margin-bottom: 16px; color: #333; }
        .vacio { text-align: center; color: #888; padding: 40px; font-size: 18px; }
        .pedido-card { background: white; border-radius: 8px; padding: 20px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); border-left: 4px solid #c01e38; }
        .pedido-card.entregado { border-left-color: #28a745; opacity: 0.9; }
        .pedido-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; flex-wrap: wrap; gap: 10px; }
        .pedido-id { font-size: 18px; font-weight: bold; color: #c01e38; }
        .pedido-estado { padding: 4px 12px; border-radius: 20px; font-size: 14px; font-weight: 600; background-color: #fff3cd; color: #856404; }
        .pedido-estado.entregado { background-color: #d4edda; color: #155724; }
        .pedido-datos { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 16px; }
        .dato-group h4 { font-size: 13px; color: #666; margin-bottom: 4px; }
        .dato-group p { font-size: 15px; color: #333; }
        .pedido-items { background: #f9f9f9; padding: 16px; border-radius: 6px; margin-bottom: 12px; }
        .item { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px dashed #ddd; }
        .item:last-child { border-bottom: none; }
        .item-total { display: flex; justify-content: space-between; font-weight: bold; font-size: 17px; margin-top: 10px; padding-top: 10px; border-top: 2px solid #ddd; color: #c01e38; }
        .botonera { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
        button, .btn-link { padding: 10px 16px; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: 600; border: none; text-decoration: none; display: inline-block; text-align: center; }
        .btn-whatsapp { background-color: #25d366; color: white; }
        .btn-estado { background-color: #28a745; color: white; }
        .btn-eliminar { background-color: #dc3545; color: white; }
        .refrescar { background-color: #007bff; color: white; margin-bottom: 20px; }
        .aviso { font-size: 12px; color: #666; margin-top: 4px; }
    </style>
</head>
<body>
    <header>
        <h1>🍗 SALSERO — Panel de Control</h1>
    </header>
    <div class="container">
        <button class="refrescar" onclick="cargarPedidos()">🔄 Refrescar Lista</button>
        <h2>Pedidos Recibidos</h2>
        
        <div id="lista-pedidos"></div>
    </div>

<script>
const API = "/api";
const TELEFONO = "59179712308";

function armarMensaje(pedido) {
    let lineas = [];
    lineas.push("🛒 NUEVO PEDIDO - SALSERO");
    lineas.push("========================");
    lineas.push("PEDIDO N°: " + pedido.id);
    lineas.push("CLIENTE: " + pedido.nombre_cliente);
    lineas.push("TELÉFONO: " + pedido.telefono);
    lineas.push("DIRECCIÓN: " + pedido.direccion);
    if (pedido.ubicacion) lineas.push("GPS: " + pedido.ubicacion);
    lineas.push("");
    lineas.push("ARTÍCULOS:");
    pedido.items.forEach(function(item) {
        lineas.push(item.nombre + " x" + item.cantidad + " = Bs. " + item.subtotal.toFixed(2));
    });
    lineas.push("");
    lineas.push("TOTAL: Bs. " + pedido.total.toFixed(2));
    lineas.push("ESTADO: " + (pedido.estado === "entregado" ? "Entregado" : "Pendiente"));
    return encodeURIComponent(lineas.join("\n"));
}

async function cargarPedidos() {
    const contenedor = document.getElementById("lista-pedidos");
    try {
        const res = await fetch(API + "/pedidos");
        if (!res.ok) throw new Error("Error");
        const pedidos = await res.json();
        
        if (pedidos.length === 0) {
            contenedor.innerHTML = '<p class="vacio">📭 No hay pedidos registrados todavía</p>';
            return;
        }

        let html = "";
        pedidos.forEach(function(p) {
            var esEntregado = p.estado === "entregado";
            var mensaje = armarMensaje(p);
            var enlaceWA = "whatsapp://send?phone=" + TELEFONO + "&text=" + mensaje;
            
            let itemsHTML = "";
            p.items.forEach(function(item) {
                itemsHTML += '<div class="item"><span>' + item.nombre + ' × ' + item.cantidad + 
                             '</span><span>Bs. ' + item.subtotal.toFixed(2) + '</span></div>';
            });

            html += '<div class="pedido-card ' + (esEntregado ? 'entregado' : '') + '">' +
                '<div class="pedido-header">' +
                    '<span class="pedido-id">Pedido #' + p.id + '</span>' +
                    '<span class="pedido-estado ' + (esEntregado ? 'entregado' : '') + '">' +
                        (esEntregado ? '✅ Entregado' : '⏳ Pendiente') +
                    '</span>' +
                '</div>' +
                '<div class="pedido-datos">' +
                    '<div class="dato-group"><h4>Nombre</h4><p>' + p.nombre_cliente + '</p></div>' +
                    '<div class="dato-group"><h4>Teléfono</h4><p>' + p.telefono + '</p></div>' +
                    '<div class="dato-group"><h4>Dirección</h4><p>' + p.direccion + '</p></div>' +
                    (p.ubicacion ? '<div class="dato-group"><h4>Ubicación GPS</h4><p>' + p.ubicacion + '</p></div>' : '') +
                '</div>' +
                '<div class="pedido-items">' +
                    '<h4 style="margin-bottom:8px;">Artículos del Pedido</h4>' +
                    itemsHTML +
                    '<div class="item-total"><span>TOTAL</span><span>Bs. ' + p.total.toFixed(2) + '</span></div>' +
                '</div>' +
                '<div class="botonera">' +
                    '<a href="' + enlaceWA + '" class="btn-link btn-whatsapp">📤 Abrir en WhatsApp</a>' +
                    (!esEntregado ? '<button class="btn-estado" onclick="marcarEntregado(' + p.id + ')">✅ Marcar Entregado</button>' : '') +
                    '<button class="btn-eliminar" onclick="eliminarPedido(' + p.id + ')">🗑️ Eliminar</button>' +
                '</div>' +
                '<p class="aviso">💡 Si pregunta: "¿Abrir WhatsApp?" → elige Sí/Abrir</p>' +
            '</div>';
        });
        contenedor.innerHTML = html;
    } catch (err) {
        contenedor.innerHTML = '<p style="color:red;text-align:center;padding:40px">❌ Error al cargar los pedidos</p>';
        console.error(err);
    }
}

async function marcarEntregado(id) {
    if (!confirm("¿Marcar como ENTREGADO?")) return;
    try {
        await fetch(API + "/pedidos/" + id + "?estado=entregado", { method: "PATCH" });
        cargarPedidos();
    } catch(e) { alert("No se pudo actualizar"); }
}

function eliminarPedido(id) {
    if (!confirm("¿Eliminar este pedido?")) return;
    cargarPedidos();
}

cargarPedidos();
</script>
</body>
</html>
